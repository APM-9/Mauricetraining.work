<style>
:root{--bg:#07060b;--panel:#15121d;--honey:#ffb829;--cyan:#5ff3e0;--ink:#f4eee3;--mute:#a79c8f;--line:rgba(255,184,41,.35);--sans:'Space Grotesk',system-ui,sans-serif;--script:'Nothing You Could Do',cursive;--pw:300px;--ph:410px}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-tap-highlight-color:transparent}html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-text-size-adjust:100%}
body{overflow-x:hidden}body:not(.flat){overflow:hidden;position:fixed;inset:0;width:100%;overscroll-behavior:none}body:not(.flat) .vp{touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
#spacer{width:1px}
body.flat #spacer{height:0!important}

/* ---------- stage ---------- */
.vp{position:fixed;inset:0;z-index:1;overflow:hidden;background:radial-gradient(circle at 50% 46%,rgba(255,184,41,.30) 0,rgba(255,120,40,.10) 16%,transparent 38%),#07060b}
.world{-webkit-transform-style:preserve-3d;position:absolute;left:50%;top:46%;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 46%,transparent 42%,rgba(4,3,8,.82) 100%)}
.seg{-webkit-backface-visibility:visible;position:absolute;left:0;top:0;transform-origin:0 0;backface-visibility:visible}
.floor{background:linear-gradient(rgba(255,184,41,.55) 2px,transparent 2px) 0 0/200px 200px,linear-gradient(90deg,rgba(255,184,41,.2) 2px,transparent 2px) 0 0/200px 200px,linear-gradient(#17121f,#0d0a13)}
.ceil{background:linear-gradient(rgba(95,243,224,.28) 2px,transparent 2px) 0 0/200px 200px,linear-gradient(90deg,rgba(95,243,224,.12) 2px,transparent 2px) 0 0/200px 200px,#0a0810}
.wall{background:repeating-linear-gradient(90deg,transparent 0 396px,rgba(95,243,224,.5) 396px 400px),linear-gradient(180deg,rgba(255,184,41,.45),transparent 6%,transparent 94%,rgba(255,184,41,.45)),linear-gradient(#120e19,#0b0910)}
.gate{position:absolute;left:0;top:0;pointer-events:none;border:2px solid var(--honey);border-radius:22px;box-shadow:0 0 40px rgba(255,184,41,.55),inset 0 0 60px rgba(255,184,41,.12)}
.gate b{position:absolute;top:-18px;left:50%;transform:translateX(-50%);background:var(--bg);padding:0 14px;color:var(--honey);font-size:13px;letter-spacing:.3em;white-space:nowrap;font-weight:500}

/* panels (racks) */
.pnl{position:absolute;left:0;top:0;width:var(--pw);height:var(--ph);margin:calc(var(--ph) / -2) 0 0 calc(var(--pw) / -2);border-radius:16px;overflow:hidden;text-align:left;background:linear-gradient(160deg,#241c2e,#120f19);border:1px solid var(--line);box-shadow:0 0 50px rgba(255,170,40,.2);display:flex;flex-direction:column}
.pnl .im{flex:1;min-height:0;position:relative;overflow:hidden}
.pnl img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s}
.pnl:hover img{transform:scale(1.05)}
.pnl .lb{padding:12px 14px 14px;display:grid;gap:3px;border-top:1px solid var(--line);background:rgba(10,8,15,.9)}
.pnl .nm{font-size:17px;font-weight:700;line-height:1.15}
.pnl .pr{font-size:13px;color:var(--mute)}
.pnl .try{position:absolute;right:12px;top:12px;background:var(--honey);color:#1b1206;font-size:11px;font-weight:700;letter-spacing:.12em;padding:6px 10px;border-radius:999px;text-transform:uppercase}
.pnl .new{position:absolute;left:12px;top:12px;border:1px solid var(--cyan);color:var(--cyan);font-size:11px;letter-spacing:.14em;padding:5px 9px;border-radius:999px;background:rgba(7,6,11,.7)}
.sign{position:absolute;left:0;top:0;pointer-events:none;text-align:center}
.sign .k{color:var(--cyan);letter-spacing:.4em;font-size:13px;text-transform:uppercase}
.sign h2{font-weight:700;letter-spacing:-.03em;line-height:.92;text-shadow:0 0 40px rgba(255,184,41,.55)}
.sign p{color:var(--mute);margin-top:14px}
.plaque{position:absolute;left:0;top:0;border:1px solid var(--line);border-radius:20px;background:rgba(14,11,20,.82);box-shadow:0 0 60px rgba(255,184,41,.25);text-align:center;padding:30px 26px}
.plaque p{font-weight:500;line-height:1.35}
.wall-end{position:absolute;left:0;top:0;border:1px solid var(--honey);border-radius:22px;background:linear-gradient(160deg,#1b1424,#0d0a13);box-shadow:0 0 90px rgba(255,184,41,.4);padding:26px;display:grid;gap:14px;align-content:start}
.wall-end h3{font-size:28px;line-height:1.05}
@media(max-width:699px){.wall-end{padding:22px;gap:11px}.wall-end h3{font-size:25px}.wall-end textarea{height:56px}}
.wall-end h3 em{font-style:normal;color:var(--honey)}
.wall-end form{display:grid;gap:9px}
.wall-end input,.wall-end textarea{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:11px 13px;outline:0;font-size:15px;width:100%}
.wall-end input:focus,.wall-end textarea:focus{border-color:var(--honey)}
.wall-end textarea{height:70px;resize:none}
.wbtn{height:46px;border-radius:999px;background:var(--honey);color:#1b1206;font-weight:700}
.wlinks{display:flex;gap:16px;flex-wrap:wrap;color:var(--mute);font-size:13px;border-top:1px solid rgba(255,255,255,.1);padding-top:12px}
.wlinks a{color:var(--mute);text-decoration:none}.wlinks a:hover{color:var(--ink)}
.wok{display:none;color:var(--cyan)}

/* ---------- HUD ---------- */
.hud{position:fixed;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;pointer-events:none}
.hud>*{pointer-events:auto}
.logo{font-family:var(--script);font-size:30px;color:#fff;text-decoration:none;text-shadow:0 0 18px rgba(255,184,41,.6)}
.hr{display:flex;gap:8px;align-items:center}
.pill{height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(10,8,15,.7);font-size:13px;letter-spacing:.06em;display:inline-flex;align-items:center;gap:8px;position:relative}
.pill:hover{border-color:var(--honey)}
.pill svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.badge{background:var(--honey);color:#1b1206;border-radius:9px;min-width:18px;height:18px;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
.badge:empty{display:none}
.zone{position:fixed;left:50%;top:66px;transform:translateX(-50%);z-index:19;font-size:11px;letter-spacing:.28em;color:var(--cyan);text-transform:uppercase;white-space:nowrap;text-align:center;pointer-events:none}
.zone small{display:block;color:var(--mute);letter-spacing:.2em;margin:3px auto 0;max-width:86vw;overflow:hidden;text-overflow:ellipsis}
.rail{position:fixed;left:14px;top:50%;transform:translateY(-50%);z-index:19;height:38vh;width:2px;background:rgba(255,255,255,.14);border-radius:2px}
.rail i{position:absolute;left:0;top:0;width:100%;background:var(--honey);box-shadow:0 0 10px var(--honey);height:0}
.hint{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:19;text-align:center;font-size:12px;letter-spacing:.3em;color:var(--ink);text-transform:uppercase;pointer-events:none;transition:opacity .4s}
.hint span{display:block;margin:8px auto 0;width:22px;height:34px;border:1.5px solid var(--ink);border-radius:12px;position:relative}
.hint span::after{content:'';position:absolute;left:50%;top:7px;width:3px;height:7px;border-radius:2px;background:var(--honey);transform:translateX(-50%);animation:sc 1.4s infinite}
@keyframes sc{0%{opacity:0;transform:translate(-50%,0)}30%{opacity:1}100%{opacity:0;transform:translate(-50%,12px)}}
.jump{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:8px;overflow-x:auto;padding:10px 14px calc(12px + env(safe-area-inset-bottom));scrollbar-width:none;justify-content:safe center;background:linear-gradient(transparent,rgba(5,4,8,.85) 40%)}
.jump::-webkit-scrollbar{display:none}
.jump button{flex:none;height:38px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:rgba(10,8,15,.75);font-size:13px;letter-spacing:.06em}
.jump button.on{background:var(--honey);color:#1b1206;border-color:var(--honey);font-weight:700}
.meter{position:fixed;right:16px;bottom:70px;z-index:19;font-size:11px;letter-spacing:.2em;color:var(--mute);text-align:right;pointer-events:none}
.meter b{color:var(--ink);font-weight:500}
body.flat .vp,body.flat .zone,body.flat .rail,body.flat .hint,body.flat .meter,body.flat .jump{display:none}

/* flat fallback */
#flat{display:none;padding:96px 18px 60px;max-width:1200px;margin:0 auto;position:relative;z-index:2}
body.flat #flat{display:block}
#flat h2{font-size:clamp(28px,6vw,44px);margin:34px 0 14px;letter-spacing:-.02em}
#flat h2 em{font-style:normal;color:var(--honey)}
.fg{display:grid;gap:14px;grid-template-columns:repeat(2,1fr)}
@media(min-width:800px){.fg{grid-template-columns:repeat(4,1fr)}}
.fg .pnl{position:relative;width:auto;height:auto;margin:0;aspect-ratio:3/4.2}

/* drawers, fitting room */
.scrim{position:fixed;inset:0;background:rgba(3,2,6,.7);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:.25s;z-index:60}
.scrim.on{opacity:1;pointer-events:auto}
.fit{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;padding:14px;pointer-events:none}
.fit.on{display:flex}
.fit>div{pointer-events:auto;width:min(880px,100%);max-height:92vh;overflow:auto;background:linear-gradient(160deg,#1d1627,#0e0b14);border:1px solid var(--honey);border-radius:22px;box-shadow:0 0 80px rgba(255,184,41,.35);display:grid;grid-template-columns:1fr;position:relative}
@media(min-width:760px){.fit>div{grid-template-columns:1fr 1fr}}
.fit .fimg{aspect-ratio:1/1.05;background-size:cover;background-position:center}
.fit .fb{padding:22px 22px 24px}
.fit .x{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(7,6,11,.8);border:1px solid var(--line);z-index:2;font-size:20px}
.fit .eb{color:var(--cyan);font-size:12px;letter-spacing:.3em;text-transform:uppercase}
.fit h3{font-size:32px;line-height:1.05;margin:6px 0 14px;letter-spacing:-.02em}
.pcs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pcs.one{grid-template-columns:1fr}
.pc{border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;text-align:left;font-size:13px;color:var(--mute)}
.pc b{display:block;font-size:16px;color:var(--ink);font-weight:500}
.pc.on{border-color:var(--honey);background:rgba(255,184,41,.12)}
.sz{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:12px}
.sz label{width:58px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.sz button{width:40px;height:36px;border-radius:10px;border:1px solid rgba(255,255,255,.18);font-size:13px}
.sz button.on{background:var(--honey);color:#1b1206;border-color:var(--honey);font-weight:700}
.add{width:100%;height:52px;margin-top:20px;border-radius:999px;background:var(--honey);color:#1b1206;font-weight:700;font-size:16px;box-shadow:0 0 30px rgba(255,184,41,.4)}
.add:disabled{opacity:.4}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(420px,94vw);background:#0f0c16;border-left:1px solid var(--honey);z-index:80;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;align-items:center;padding:16px 18px;border-bottom:1px solid rgba(255,255,255,.1)}
.dh h3{font-size:22px}
.ship{padding:14px 18px;background:rgba(255,184,41,.08);font-size:13px}
.ship .tr{height:6px;border-radius:3px;background:rgba(255,255,255,.12);margin-top:8px;overflow:hidden}
.ship .tr i{display:block;height:100%;background:var(--honey);box-shadow:0 0 10px var(--honey);transition:width .4s}
.db{flex:1;overflow:auto;padding:6px 18px}
.li{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.li .sw{width:62px;height:72px;border-radius:10px}
.li b{font-weight:500;font-size:14px;display:block}.li small{color:var(--mute)}
.qty{display:inline-flex;align-items:center;gap:8px;margin-top:6px;border:1px solid rgba(255,255,255,.18);border-radius:999px}
.qty button{width:28px;height:28px}
.empty{text-align:center;color:var(--mute);padding:50px 0}
.df{padding:16px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1)}
.tot{display:flex;justify-content:space-between;font-size:17px;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);background:var(--honey);color:#1b1206;padding:11px 18px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:.3s;z-index:90;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,0)}
.demo{position:fixed;left:16px;bottom:72px;z-index:18;font-size:10px;letter-spacing:.12em;color:var(--mute);text-transform:uppercase;pointer-events:none}
</style>

{id:'midnight-tide',name:'Midnight Tide',style:'print',top:['The Midnight Tide Top',52],bot:['The Midnight Tide Bottom',48],bg:'repeating-linear-gradient(100deg,#2f56c8 0 6px,#f4f6fb 6px 11px,#d0782f 11px 14px)'},
{id:'ribbed-ivory',name:'Ribbed Ivory',style:'ribbed',top:['The Ribbed Ivory Top',45],bot:['The Ribbed Ivory Bottom',50],bg:'#f1e8d2'},
{id:'ribbed-brick',name:'Ribbed Brick',style:'ribbed',top:['The Ribbed Brick Top',45],bot:['The Ribbed Brick Bottom',50],bg:'#a63b2e'},
{id:'ribbed-peach',name:'Ribbed Peach',style:'ribbed',top:['The Ribbed Peach Top',48],bot:['The Ribbed Peach Bottom',45],bg:'#f6a27c'},
{id:'mint-one',name:'The Mint One Piece',style:'one',one:['The Mint One Piece',78],bg:'#9dbf9a'},
{id:'desert-honey',name:'The Desert Honey One Piece',style:'one',one:['The Desert Honey One Piece',78],bg:'#a08e7a'}
];
const OTHER={
men:[['Black SH Boardshorts',45,'#1d1d1d',1],['Forrest SH Boardshorts',45,'#7d8d6b',1]],
app:[['Sew Honey Hoodie',58,'#cdbfa8',1],['SH Crew Neck',45,'#e7cdbd',1]],
acc:[['Vintage Aviators',15.99,'#8a6a6a'],['Metal Frame Aviators',18.99,'#7a7a52'],['SH Jute Tote Bag',16,'#d9cdb4'],['Sew Honey Jute Tote Bag',16,'#efe6d0'],['Sew Honey Cap',24,'#1f2a44'],['SH Logo Cap',24,'#c85a40'],['Sew Honey Bucket Hat',23,'#efc3bb']]
};
const ITEMS={women:[],men:[],app:[],acc:[]};
SETS.forEach(s=>ITEMS.women.push({type:'set',s,key:s.id,name:s.name}));
['men','app','acc'].forEach(g=>OTHER[g].forEach(p=>ITEMS[g].push({type:'one',key:p[0],name:p[0],price:p[1],bg:p[2],sz:!!p[3]})));

const $=s=>document.querySelector(s);
const money=n=>'$'+(Math.round(n*100)/100).toFixed(2).replace(/\.00$/,'');
const thumb=(k,fb)=>PHOTOS[k]?`url('${PHOTOS[k]}') center/cover`:fb;
const bgOf=it=>it.type==='set'?it.s.bg:it.bg;
let cart=[],sel={};

/* ---------- panel markup ---------- */
function priceLine(it){
  if(it.type==='one')return money(it.price);
  const s=it.s;return s.style==='one'?money(s.one[1]):`Top ${money(s.top[1])} · Bottom ${money(s.bot[1])}`;
}
function panelHTML(it,idx){
  const img=PHOTOS[it.key]?`<img src="${PHOTOS[it.key]}" alt="${it.name}">`:`<div style="width:100%;height:100%;background:${bgOf(it)}"></div>`;
  const nw=it.type==='set'&&it.s.isNew?'<span class="new">NEW</span>':'';
  return `<button class="pnl" data-open="${idx}"><div class="im">${img}${nw}<span class="try">Try on</span></div><div class="lb"><span class="nm">${it.name}</span><span class="pr">${priceLine(it)}</span></div></button>`;
}

/* ---------- world layout ---------- */
let C,reg=[],segs=[],ZONES=[],camMax=0,all=[];
function consts(){const m=innerWidth<700;C={m,pw:m?250:300,ph:m?350:410,hw:m?300:520,hh:m?300:330,persp:m?700:1000,gap:m?500:600,ang:m?42:58,segl:800,ww:m?420:760,wh:m?500:520,endRel:m?-260:-190};
  document.documentElement.style.setProperty('--pw',C.pw+'px');document.documentElement.style.setProperty('--ph',C.ph+'px');$('#vp').style.perspective=C.persp+'px';$('#vp').style.perspectiveOrigin='50% 46%'}
function build(){
  consts();const W=$('#world');W.innerHTML='';reg=[];segs=[];ZONES=[];all=[];
  const add=(html,z,x,y,ry,kind,i)=>{W.insertAdjacentHTML('beforeend',html);const el=W.lastElementChild;
    el.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateY(${ry}deg)`;reg.push({el,z,kind,i});return el};
  const px=-(C.hw-C.pw*Math.cos(C.ang*Math.PI/180)/2-10);
  const py=C.m?14:8;
  let z=-260;
  /* entrance sign */
  add(`<div class="sign" style="width:${C.m?340:760}px;margin-left:${C.m?-170:-380}px;margin-top:${C.m?-150:-170}px"><div class="k">Sew Honey · Handmade swim</div><h2 style="font-size:${C.m?58:120}px;font-family:var(--script);font-weight:400;letter-spacing:0">Walk in.</h2><p style="font-size:${C.m?15:18}px">Scroll to walk the aisle.<br>Tap anything on the racks to try it on.</p></div>`,z,0,0,0,'sign');
  ZONES.push({id:'enter',label:'Entrance',sub:'Sew Honey',z:0,cam:0});
  z=-1700;
  const zoneStart=(id,label,sub,k)=>{
    add(`<div class="gate" style="width:${C.hw*2}px;height:${C.hh*2}px;margin:${-C.hh}px 0 0 ${-C.hw}px"><b>${label.toUpperCase()}</b></div>`,z,0,0,0,'gate');
    add(`<div class="sign" style="width:${C.m?340:820}px;margin-left:${C.m?-170:-410}px;margin-top:${C.m?-120:-130}px"><div class="k">${k}</div><h2 style="font-size:${C.m?54:104}px">${label}</h2><p style="font-size:${C.m?14:17}px">${sub}</p></div>`,z-60,0,0,0,'sign');
    ZONES.push({id,label,sub,z,cam:Math.max(0,-z-(C.m?560:760))});
    z-=C.gap*1.5;
  };
  const rack=(group)=>{
    const list=ITEMS[group];
    for(let i=0;i<list.length;i+=2){
      [[0,-1],[1,1]].forEach(([o,side])=>{const it=list[i+o];if(!it)return;const idx=all.length;all.push(it);
        add(panelHTML(it,idx),z,side*-px,py,side<0?C.ang:-C.ang,'pnl',idx)});
      z-=C.gap;
    }
    z-=C.gap*.4;
  };
  zoneStart('women',"Women's Swim",`${ITEMS.women.length} prints · every top and bottom sold separately`,'Aisle 01');
  rack('women');
  zoneStart('men',"Men's Swim",'Boardshorts','Aisle 02');rack('men');
  zoneStart('app','Apparel','Hoodie · Crew','Aisle 03');rack('app');
  zoneStart('acc','Beach Extras','Shades · Hats · Totes','Aisle 04');rack('acc');
  /* story plaque */
  add(`<div class="gate" style="width:${C.hw*2}px;height:${C.hh*2}px;margin:${-C.hh}px 0 0 ${-C.hw}px"><b>MADE DIFFERENTLY</b></div>`,z,0,0,0,'gate');
  add(`<div class="plaque" style="width:${C.m?460:760}px;margin-left:${C.m?-230:-380}px;margin-top:${C.m?-150:-150}px"><div style="color:var(--cyan);letter-spacing:.35em;font-size:12px;margin-bottom:14px">OUR STORY</div><p style="font-size:${C.m?26:34}px">Every swimsuit is handmade with care, from mindful design to low-waste production, keeping people and the planet in mind.</p></div>`,z-80,0,0,0,'sign');
  ZONES.push({id:'story',label:'Our Story',sub:'Made differently',z,cam:Math.max(0,-z-(C.m?560:760))});
  z-=C.gap*3;
  /* end wall */
  const endZ=z;
  add(`<div class="wall-end" id="endwall" style="width:${C.ww}px;height:${C.wh}px;margin:${-C.wh/2}px 0 0 ${-C.ww/2}px"><div style="color:var(--cyan);letter-spacing:.35em;font-size:12px">WHOLESALE</div><h3>Carry <em>Sew Honey</em> in your shop</h3><form id="wsForm"><input required placeholder="Your name"><input required placeholder="Business name"><input required type="email" placeholder="Email"><textarea placeholder="Tell us about your shop"></textarea><button class="wbtn" type="submit">Send inquiry</button><div class="wok" id="wsOk">Thank you. This is a demo form, so nothing was sent.</div></form><div class="wlinks"><a href="#" data-jump="0">Back to start</a><a href="#" data-jump="1">Women's</a><a href="#" data-jump="2">Men's</a><span>Free shipping over $125</span></div></div>`,endZ,0,0,0,'wall',-1);
  camMax=-endZ+C.endRel;   /* wall ends up at rel = endRel from the origin */
  ZONES.push({id:'wholesale',label:'Wholesale',sub:'Become a retailer',z:endZ,cam:camMax});
  /* tunnel segments */
  const n=Math.ceil((900-endZ)/C.segl);
  const mk=(cls,tf,w,h)=>{W.insertAdjacentHTML('afterbegin',`<div class="seg ${cls}" style="width:${w}px;height:${h}px;transform:${tf}"></div>`);return W.firstElementChild};
  for(let k=0;k<n;k++){const zs=900-k*C.segl;const hw=C.hw,hh=C.hh,L=Math.min(C.segl,zs-endZ);
    segs.push({z:zs,els:[
      mk('floor',`translate3d(${-hw}px,${hh}px,${zs}px) rotateX(-90deg)`,hw*2,L),
      mk('ceil',`translate3d(${-hw}px,${-hh}px,${zs}px) rotateX(-90deg)`,hw*2,L),
      mk('wall',`translate3d(${-hw}px,${-hh}px,${zs}px) rotateY(90deg)`,L,hh*2),
      mk('wall',`translate3d(${hw}px,${-hh}px,${zs}px) rotateY(90deg)`,L,hh*2)]});}
  /* spacer + flat list */
  $('#spacer').style.height='0px';
  buildJump();buildFlat();
}
function buildJump(){
  const J=[['Start',0],['Women',1],['Men',2],['Apparel',3],['Extras',4],['Story',5],['Wholesale',6]];
  $('#jump').innerHTML=J.map(([t,i])=>`<button data-jump="${i}" data-z="${i}">${t}</button>`).join('');
}
function buildFlat(){
  const H={women:"Women's <em>swim</em>",men:"Men's <em>swim</em>",app:'<em>Apparel</em>',acc:'Beach <em>extras</em>'};
  let html='',idx=0;
  ['women','men','app','acc'].forEach(g=>{html+=`<h2>${H[g]}</h2><div class="fg">`;ITEMS[g].forEach(it=>{html+=panelHTML(it,idx++)});html+='</div>'});
  $('#flat').innerHTML=html;
}

/* ---------- camera ---------- */
let pos=0,vel=0,cam=0,target=0,lastCam=-1,flat=false;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function applyCam(){
  $('#world').style.transform=`translate3d(0,0,${cam}px)`;
  const P=C.persp;
  for(const o of reg){
    const d=P-(o.z+cam);let op=0;
    if(o.kind==='sign')op=clamp((d-520)/480,0,1)*clamp((2500-d)/500,0,1);
    else if(d>110&&d<3900)op=clamp((d-110)/380,0,1)*clamp((3900-d)/1900,0,1);
    if(o.op!==op){o.op=op;o.el.style.opacity=op;o.el.style.display=op<.01?'none':'';
      o.el.style.pointerEvents=(o.kind==='pnl'||o.kind==='wall')&&op>.45?'auto':'none'}
  }
  for(const s of segs){
    const dn=P-(s.z+cam),df=P-(s.z-C.segl+cam);let op=0;
    if(df>60&&dn<4400)op=clamp(1-(dn-1100)/3200,0,1);
    if(s.op!==op){s.op=op;s.els.forEach(e=>{e.style.opacity=op;e.style.display=op<.01?'none':''})}
  }
  /* HUD */
  let zi=0;ZONES.forEach((z,i)=>{if(cam>=z.cam-120)zi=i});
  const Z=ZONES[zi];$('#zone').innerHTML=`${String(zi).padStart(2,'0')} / ${String(ZONES.length-1).padStart(2,'0')} · ${Z.label}<small>${Z.sub}</small>`;
  document.querySelectorAll('#jump button').forEach(b=>b.classList.toggle('on',+b.dataset.z===zi));
  $('#rail').style.height=(cam/Math.max(1,camMax)*100)+'%';
  $('#depth').textContent=String(Math.round(cam/20)).padStart(4,'0');
  $('#hint').style.opacity=cam>160?0:1;
}
function tick(){
  if(!flat){
    pos=clamp(pos+vel,0,camMax);vel*=.92;if(Math.abs(vel)<.05)vel=0;target=pos;
    cam+=(target-cam)*.1;if(Math.abs(target-cam)<.15)cam=target;
    if(Math.abs(cam-lastCam)>.05){lastCam=cam;applyCam()}
  }
  requestAnimationFrame(tick);
}
function jumpTo(i){const z=ZONES[i];if(!z)return;vel=0;pos=clamp(z.cam,0,camMax);cam=pos;target=pos;lastCam=-1;applyCam()}
(function(){let y0=null,ly=0,lt=0;const free=t=>t.closest&&t.closest('.fit,.drawer,#endwall,#jump,button,a,input,textarea');
const inWalk=()=>!flat;
document.addEventListener('touchstart',e=>{if(!inWalk()||e.touches.length!==1)return;const t=e.target;y0=free(t)&&t.closest('.fit,.drawer,input,textarea')?null:e.touches[0].clientY;ly=y0;lt=e.timeStamp;vel=0},{passive:true});
document.addEventListener('touchmove',e=>{if(!inWalk()||y0===null)return;const y=e.touches[0].clientY,d=ly-y;ly=y;pos=clamp(pos+d*2.6,0,camMax);const dt=Math.max(8,e.timeStamp-lt);lt=e.timeStamp;vel=d*2.6/dt*16*.6;e.preventDefault()},{passive:false});
document.addEventListener('touchend',()=>{y0=null});
document.addEventListener('wheel',e=>{if(!inWalk()||e.target.closest('.fit,.drawer'))return;e.preventDefault();pos=clamp(pos+e.deltaY*2,0,camMax)},{passive:false});
addEventListener('keydown',e=>{if(!inWalk()||/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;const k=e.key;if(k==='ArrowDown'||k==='PageDown'||k===' '){e.preventDefault();pos=clamp(pos+(k==='ArrowDown'?260:900),0,camMax)}else if(k==='ArrowUp'||k==='PageUp'){e.preventDefault();pos=clamp(pos-(k==='ArrowUp'?260:900),0,camMax)}});
})();
document.addEventListener('mousemove',e=>{if(C.m||flat)return;$('#vp').style.perspectiveOrigin=`${50+(e.clientX/innerWidth-.5)*7}% ${46+(e.clientY/innerHeight-.5)*5}%`});

/* ---------- fitting room ---------- */
function state(it){const k=it.key;return sel[k]||(sel[k]={t:true,b:true,st:'S',sb:'S',so:'S',z:'M'})}
function sizeRow(label,key,cur){return `<div class="sz"><label>${label}</label>${SIZES.map(z=>`<button class="${cur===z?'on':''}" data-act="size" data-k="${key}" data-z="${z}">${z}</button>`).join('')}</div>`}
let cur=null;
function fitHTML(it){
  const st=state(it);let body,total=0,any=true,kind;
  if(it.type==='one'){
    total=it.price;kind='Single piece';
    body=`<div class="pcs one"><div class="pc on"><b>${money(it.price)}</b>${it.sz?'Choose your size':'One size'}</div></div>${it.sz?sizeRow('Size','z',st.z):''}`;
  }else{
    const s=it.s;kind={print:'Print',solid:'Solid',ribbed:'Ribbed',one:'One piece'}[s.style];
    if(s.style==='one'){total=s.one[1];body=`<div class="pcs one"><div class="pc on"><b>One piece</b>${money(s.one[1])}</div></div>${sizeRow('Size','so',st.so)}`}
    else{
      if(st.t)total+=s.top[1];if(st.b)total+=s.bot[1];any=st.t||st.b;
      body=`<div class="pcs"><button class="pc ${st.t?'on':''}" data-act="tog" data-k="t"><b>Top</b>${money(s.top[1])}</button><button class="pc ${st.b?'on':''}" data-act="tog" data-k="b"><b>Bottom</b>${money(s.bot[1])}</button></div>${st.t?sizeRow('Top','st',st.st):''}${st.b?sizeRow('Bottom','sb',st.sb):''}`;
    }
  }
  const img=PHOTOS[it.key]?`url('${PHOTOS[it.key]}') center/cover`:bgOf(it);
  return `<div><button class="x" data-close aria-label="Close">×</button><div class="fimg" style="background:${img}"></div><div class="fb"><div class="eb">Fitting room · ${kind}</div><h3>${it.name}</h3>${body}<button class="add" data-act="add" ${any?'':'disabled'}>${any?'Add to bag · '+money(total):'Pick a piece'}</button></div></div>`;
}
function openFit(i){cur=all[i];if(!cur)return;$('#fit').innerHTML=fitHTML(cur);$('#fit').classList.add('on');$('#scrim').classList.add('on')}
function closeAll(){$('#fit').classList.remove('on');$('#cart').classList.remove('on');$('#scrim').classList.remove('on')}

/* ---------- bag ---------- */
function addItem(name,size,price,bg){const key=name+'|'+size;const ex=cart.find(i=>i.key===key);if(ex)ex.qty++;else cart.push({key,name,size,price,bg,qty:1})}
function renderCart(){
  const n=cart.reduce((a,i)=>a+i.qty,0),sub=cart.reduce((a,i)=>a+i.qty*i.price,0);
  $('#count').textContent=n||'';$('#sub').textContent=money(sub);
  const left=125-sub;
  $('#ship').innerHTML=(left>0?`<b>${money(left)}</b> to free shipping`:'<b>Free shipping unlocked</b>')+`<div class="tr"><i style="width:${Math.min(100,sub/125*100)}%"></i></div>`;
  $('#items').innerHTML=cart.length?cart.map(i=>`<div class="li"><div class="sw" style="background:${i.bg}"></div><div><b>${i.name}</b><small>${i.size!=='-'?'Size '+i.size:'One size'}</small><div class="qty"><button data-act="dec" data-k="${i.key}">−</button><span>${i.qty}</span><button data-act="inc" data-k="${i.key}">+</button></div></div><b>${money(i.price*i.qty)}</b></div>`).join(''):'<div class="empty">Your bag is empty.<br>Walk the aisle and grab something.</div>';
  $('#co').disabled=!cart.length;
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2000)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-open],[data-act],[data-close],[data-jump],#openCart,#co,#flatBtn,#logo,#scrim');if(!b)return;
  if(b.id==='logo'){e.preventDefault();flat?scrollTo({top:0,behavior:'smooth'}):jumpTo(0);return}
  if(b.dataset.jump!==undefined){e.preventDefault();if(flat)setFlat(false);jumpTo(+b.dataset.jump);return}
  if(b.dataset.open!==undefined){openFit(+b.dataset.open);return}
  if(b.id==='openCart'){$('#cart').classList.add('on');$('#scrim').classList.add('on');return}
  if(b.id==='scrim'||b.hasAttribute('data-close')){closeAll();return}
  if(b.id==='co'){toast('Demo only: checkout is off');return}
  if(b.id==='flatBtn'){setFlat(!flat);return}
  const a=b.dataset.act,st=cur&&state(cur);
  if(a==='tog'){st[b.dataset.k]=!st[b.dataset.k];$('#fit').innerHTML=fitHTML(cur)}
  else if(a==='size'){st[b.dataset.k]=b.dataset.z;$('#fit').innerHTML=fitHTML(cur)}
  else if(a==='add'){
    const tb=thumb(cur.key,bgOf(cur));let n=0;
    if(cur.type==='one'){addItem(cur.name,cur.sz?st.z:'-',cur.price,tb);n=1}
    else{const s=cur.s;if(s.style==='one'){addItem(s.one[0],st.so,s.one[1],tb);n=1}
      else{if(st.t){addItem(s.top[0],st.st,s.top[1],tb);n++}if(st.b){addItem(s.bot[0],st.sb,s.bot[1],tb);n++}}}
    renderCart();closeAll();toast(n>1?`Added ${n} pieces`:'Added to bag');
  }
  else if(a==='inc'||a==='dec'){const i=cart.find(x=>x.key===b.dataset.k);if(!i)return;i.qty+=a==='inc'?1:-1;if(i.qty<1)cart=cart.filter(x=>x!==i);renderCart()}
});
document.addEventListener('submit',e=>{if(e.target.id==='wsForm'){e.preventDefault();[...e.target.children].forEach(c=>{if(c.id!=='wsOk')c.style.display='none'});$('#wsOk').style.display='block'}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll()});
function setFlat(v){flat=v;document.body.classList.toggle('flat',v);$('#flatTxt').textContent=v?'Walk-through':'List view';if(!v){lastCam=-1;pos=cam}else scrollTo(0,0)}
let rw=innerWidth;addEventListener('resize',()=>{if((rw<700)!==(innerWidth<700)){rw=innerWidth;build();lastCam=-1}});

build();renderCart();
if(matchMedia('(prefers-reduced-motion: reduce)').matches)setFlat(true);
requestAnimationFrame(tick);
</script>
