<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact | Ashanti Maurice</title>
<meta name="description" content="Contact Ashanti Maurice about coaching, sponsorships or business.">
<meta name="theme-color" content="#0c0b0b">
<link rel="icon" href="img/logo-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
<style>
  .channels{display:grid;gap:12px;margin-top:28px}
  .channel{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:20px 22px;border:1px solid var(--line);border-radius:12px;background:var(--panel);text-decoration:none}
  .channel:hover{border-color:var(--red)}
  .channel small{display:block;color:var(--muted);font-size:.78rem;letter-spacing:.16em;text-transform:uppercase}
  .channel strong{font-size:1.1rem;word-break:break-all}
</style>
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero">
    <div class="bg"><img src="img/asbury-2.jpg" alt=""></div>
    <div class="wrap">
      <span class="eyebrow">Contact</span>
      <h1>Let's talk</h1>
      <p class="lede">Serious inquiries only — coaching, sponsorships or business.</p>
    </div>
  </section>

  <section class="section">
    <div class="wrap split">
      <div>
        <h2>Reach me directly</h2>
        <div class="channels">
          <a class="channel" data-email href="mailto:AMaurice_94@yahoo.com"><span><small>Email</small><strong data-email-text>AMaurice_94@yahoo.com</strong></span><span aria-hidden="true">→</span></a>
          <a class="channel" data-ig href="https://instagram.com/Rx_Dolo" target="_blank" rel="noopener"><span><small>Instagram</small><strong data-ig-text>@Rx_Dolo</strong></span><span aria-hidden="true">↗</span></a>
          <a class="channel" data-calendly href="https://calendly.com/fpconsultation/fighter-physique-consultation" target="_blank" rel="noopener"><span><small>Coaching consultation</small><strong>Book a call</strong></span><span aria-hidden="true">↗</span></a>
        </div>
      </div>

      <div class="card">
        <h3 style="margin-bottom:18px">Send a message</h3>
        <form class="form" action="https://formsubmit.co/AMaurice_94@yahoo.com" method="POST">
          <input type="hidden" name="_subject" value="New message from your website">
          <input type="hidden" name="_captcha" value="false">
          <input type="hidden" name="_template" value="table">
          <input type="hidden" name="_next" value="https://apm-9.github.io/Mauricetraining.work/thanks.html?from=contact">
          <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
          <label>Name<input type="text" name="name" autocomplete="name" required></label>
          <label>Email<input type="email" name="email" autocomplete="email" required></label>
          <label>Topic
            <select name="topic" id="topic" required>
              <option value="">Choose one</option>
              <option value="coaching">Coaching</option>
              <option value="sponsorship">Sponsorship</option>
              <option value="merch">Merch order</option>
              <option value="business">Business / other</option>
            </select>
          </label>
          <label>Message<textarea name="message" required></textarea></label>
          <button class="btn" type="submit">Send message</button>
        </form>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>

<script src="assets/site.js"></script>
<script>
  var t = new URLSearchParams(location.search).get("topic");
  if (t && document.querySelector('#topic option[value="' + t.replace(/[^a-z]/g, "") + '"]')) document.getElementById("topic").value = t;
</script>
</body>
</html>
