<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contact | Ashanti Maurice — Preview</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7fafb">
<link rel="icon" href="../img/logo-badge.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="v2.css">
<style>
.c-wrap{display:grid;grid-template-columns:1fr 1fr;gap:max(5cqw,32px);align-items:start;padding-top:max(5cqw,48px)}
@media (max-width:899px){.c-wrap{grid-template-columns:1fr}}
.c-wrap h1{font-size:max(9cqw,64px);margin:1rem 0 1.5rem}
.c-wrap .lede{max-width:28rem;margin-bottom:2.5rem}
.chan{display:grid;grid-template-columns:7rem 1fr auto;align-items:baseline;gap:1rem;padding:1.3rem 0;border-top:1px solid var(--foreground);text-transform:uppercase;transition:color 200ms,padding 300ms var(--ease-plate)}
.chan:last-child{border-bottom:1px solid var(--foreground)}
.chan small{font-size:var(--type-eyebrow);letter-spacing:.14em;color:var(--foreground-muted)}
.chan b{font-family:var(--font-display);font-weight:700;font-size:max(2cqw,22px);line-height:.95;word-break:break-word}
.chan i{font-style:normal;color:var(--accent)}
.chan:hover{color:var(--accent);padding-left:.6rem}
@media (max-width:539px){.chan{grid-template-columns:1fr auto}.chan small{grid-column:1/-1}}
.form{position:relative;display:grid;gap:1.4rem;padding:max(2.5cqw,24px);background:#fff}
.form .bp-c{position:absolute;inset:-1px;color:var(--foreground);pointer-events:none}
.form .bp-c svg{position:absolute;width:12px;height:12px;fill:none;stroke:currentColor}
.form h2{font-size:max(2.4cqw,28px)}
.form label{display:grid;gap:.5rem;font-size:var(--type-eyebrow);text-transform:uppercase;letter-spacing:.14em;color:var(--foreground-muted)}
.topics{display:flex;flex-wrap:wrap;gap:.5rem}
.topics input{position:absolute;opacity:0;pointer-events:none}
.topics span{display:inline-block;padding:.55rem .9rem;border:1px solid var(--foreground);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--foreground);cursor:pointer;transition:background 200ms,color 200ms}
.topics input:checked+span{background:var(--accent);border-color:var(--accent);color:#fff}
.topics input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.form input[type=text],.form input[type=email],.form textarea{font:inherit;font-size:16px;letter-spacing:0;text-transform:none;color:var(--foreground);background:transparent;border:0;border-bottom:1px solid var(--foreground);padding:.6rem 0;border-radius:0;outline:none}
.form textarea{min-height:8rem;resize:vertical}
.form input:focus,.form textarea:focus{border-bottom-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
.form .cta{justify-self:start}
</style>
</head>
<body>

<section class="block light" data-arm data-margin="0% 0% 0% 0%">
  <canvas class="contours" data-contours="--surface-soft" aria-hidden="true"></canvas>
  <div data-v2-header></div>
  <div class="inner">
    <div class="c-wrap">
      <div>
        <span class="eyebrow" data-fade="0">Contact</span>
        <h1 class="display"><span style="display:flex"><span class="split" data-split="words" data-delay="120">Let's talk</span><span class="stop" data-fade="360">.</span></span></h1>
        <p class="lede" data-rise="460">Coaching, web design projects, sponsorships or business.</p>
        <div data-rise="560">
          <a class="chan" id="chEmail" href="mailto:AMaurice_94@yahoo.com"><small>Email</small><b>AMaurice_94@yahoo.com</b><i>→</i></a>
          <a class="chan" href="https://instagram.com/Rx_Dolo" target="_blank" rel="noopener"><small>Instagram</small><b>@Rx_Dolo</b><i>↗</i></a>
          <a class="chan" href="https://calendly.com/fpconsultation/fighter-physique-consultation" target="_blank" rel="noopener"><small>Coaching</small><b>Book a call</b><i>↗</i></a>
        </div>
      </div>
      <form class="form" action="https://formsubmit.co/AMaurice_94@yahoo.com" method="POST" data-rise="400">
        <span class="bp-c" aria-hidden="true"><svg style="top:0;left:0;transform:scaleX(-1)"><use href="#corner"/></svg><svg style="top:0;right:0"><use href="#corner"/></svg><svg style="bottom:0;left:0;transform:scale(-1)"><use href="#corner"/></svg><svg style="bottom:0;right:0;transform:scaleY(-1)"><use href="#corner"/></svg></span>
        <h2 class="display">Send a message</h2>
        <input type="hidden" name="_subject" value="New message from your website">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_template" value="table">
        <input type="hidden" name="_next" value="https://ashantimaurice.com/thanks.html?from=contact">
        <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off">
        <label>Name<input type="text" name="name" autocomplete="name" required></label>
        <label>Email<input type="email" name="email" autocomplete="email" required></label>
        <fieldset style="border:0;padding:0;margin:0">
          <legend style="font-size:var(--type-eyebrow);text-transform:uppercase;letter-spacing:.14em;color:var(--foreground-muted);margin-bottom:.7rem">Topic</legend>
          <div class="topics">
            <label><input type="radio" name="topic" value="coaching" required><span>Coaching</span></label>
            <label><input type="radio" name="topic" value="web"><span>Web design</span></label>
            <label><input type="radio" name="topic" value="sponsorship"><span>Sponsorship</span></label>
            <label><input type="radio" name="topic" value="merch"><span>Merch order</span></label>
            <label><input type="radio" name="topic" value="business"><span>Business / other</span></label>
          </div>
        </fieldset>
        <label>Message<textarea name="message" required></textarea></label>
        <button class="cta" type="submit"><svg class="f" viewBox="0 0 220 50" preserveAspectRatio="none" aria-hidden="true"><path class="body" d="M0.5 0.5H219.5V42L212 49.5H0.5Z"/><path class="flood" d="M0.5 0.5H219.5V42L212 49.5H0.5Z"/></svg><span>Send message</span><svg class="a" viewBox="0 0 13.7071 10.7071" aria-hidden="true"><path d="M0 5.35355H13M8 10.3536L13 5.35355L8 0.353553"/></svg></button>
      </form>
    </div>
  </div>
</section>

<div data-v2-footer data-head="Stay ready|stay hungry"></div>

<script type="module">
import { boot } from "./v2.js";
const t = new URLSearchParams(location.search).get("topic");
const pick = t && document.querySelector(`.topics input[value="${t.replace(/[^a-z]/g, "")}"]`);
if (pick) pick.checked = true;
boot();
</script>
</body>
</html>
